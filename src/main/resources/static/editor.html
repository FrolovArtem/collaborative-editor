<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор | Совместный редактор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/" class="btn btn-outline-dark btn-sm">← Назад</a>
            <div class="text-muted small">
                Документ: <span id="docIdDisplay" class="fw-medium"></span>
            </div>
            <div class="text-muted small">
                Вы: <span id="currentUserDisplay" class="fw-medium"></span>
            </div>
        </div>

        <div id="loginBlock" style="display:none;">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <h5 class="card-title text-center mb-3">Вход в редактор</h5>
                            <div class="input-group mb-3">
                                <input type="text" id="usernameInput" class="form-control" placeholder="Ваш никнейм">
                                <button id="loginBtn" class="btn btn-dark">Войти</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="editorBlock" style="display:none;">
            <div class="row">
                <div class="col-lg-9 mb-3 mb-lg-0">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <textarea id="editor" class="form-control border-0" style="min-height: 60vh; resize: none;" placeholder="Начните печатать..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="card-title mb-3">👥 Участники</h6>
                            <ul id="userList" class="list-unstyled mb-0"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/lib/sockjs.min.js"></script>
    <script src="/lib/stomp.umd.min.js"></script>
    <script src="/editor.js"></script>
</body>
</html>
