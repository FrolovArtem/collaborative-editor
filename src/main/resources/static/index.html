<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Совместный редактор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container-fluid editor-container p-3">
    <h4>Поле для текста</h4>
    <p>
        Документ: <span id="docIdDisplay"></span> |
        Вы: <span id="currentUserDisplay"></span>
    </p>

    <div id="loginBlock" style="display:none;">
        <div class="input-group mb-3">
            <input type="text" id="usernameInput" class="form-control" placeholder="Введите ваш ник">
            <button id="loginBtn" class="btn btn-primary">Войти</button>
        </div>
    </div>

    <div id="editorBlock" style="display:none;">
        <textarea id="editor" class="form-control" placeholder="Начните печатать..."></textarea>
    </div>

    <div class="mt-3">
        <h5>Пользователи в документе:</h5>
        <ul id="userList"></ul>
    </div>
</div>

<script src="lib/sockjs.min.js"></script>
<script src="lib/stomp.umd.min.js"></script>
<script src="editor.js"></script>
</body>
</html>
